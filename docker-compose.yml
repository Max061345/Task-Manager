services:
  db:
    image: postgres:16-alpine
    container_name: task_manager_db
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-task_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - task_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    networks:
      - task_network

volumes:
  postgres_data:
    driver: local

networks:
  task_network:
    driver: bridge